name: CI

# Runs on pull requests and on main. The pull_request trigger is the one that
# matters: it makes the checks appear on the PR itself, so a branch that breaks
# the build is visible before it merges rather than after.
on:
  pull_request:
  push:
    branches: [main]

# Pushing a follow-up commit makes the previous run pointless, so cancel it
# instead of paying for two runs and waiting on the stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci installs exactly what package-lock.json specifies, unlike
      # npm install, which may quietly resolve newer versions. CI should build
      # the same tree every time.
      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # Last because it is the slowest, and because a type error is a faster,
      # clearer signal than whatever the bundler would report downstream of one.
      - run: npm run build
